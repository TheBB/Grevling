name: Documentation

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Mike needs full history to manage the gh-pages branch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          make sync

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy Master to Dev
        if: github.ref == 'refs/heads/master'
        run: uv run mike deploy --push --update-aliases dev

      - name: Deploy Tagged Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION%.*}
          LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$GITHUB_REF_NAME" = "$LATEST_TAG" ]; then
            uv run mike deploy --push --update-aliases $VERSION latest
          else
            uv run mike deploy --push $VERSION
          fi
